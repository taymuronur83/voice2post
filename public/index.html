<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice2Post AI | Sesini Markaya Dönüştür</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; background: #0f172a; color: #e2e8f0; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(90deg, #60a5fa, #34d399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .modal-overlay { transition: opacity 0.3s ease; display: none; }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content { transform: scale(0.95); transition: transform 0.3s ease; }
        .active .modal-content { transform: scale(1); }
        
        .dropdown-menu { 
            display: none; 
            transform-origin: top right; 
            background: #020617; 
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .dropdown-menu.active { display: block; animation: fadeIn 0.2s ease-out; }

        .lang-dropdown { position: relative; display: inline-block; }
        .lang-list { 
            display: none; position: absolute; right: 0; top: 100%; 
            background: #020617; border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 12px; min-width: 140px; overflow: hidden; z-index: 100;
        }
        .lang-list.show { display: block; animation: fadeIn 0.2s ease-out; }
        .lang-item { padding: 10px 15px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 14px; }
        .lang-item:hover { background: rgba(255,255,255,0.05); }
        .hidden-view { display: none; }
        .recording-pulse { animation: mic-pulse 1.5s infinite; background: #ef4444 !important; }
        @keyframes mic-pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        
        .input-mode-container { position: relative; display: flex; background: rgba(255, 255, 255, 0.05); padding: 5px; border-radius: 100px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 2rem; cursor: pointer; user-select: none; }
        .mode-slider { position: absolute; top: 5px; left: 5px; width: calc(50% - 5px); background: #2563eb; border-radius: 100px; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1; height: 40px; }
        .mode-option { position: relative; z-index: 2; padding: 10px 30px; border-radius: 100px; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; color: #94a3b8; transition: color 0.3s; }
        .mode-option.active { color: white; }
        .text-input-area { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 20px; color: white; resize: none; min-height: 150px; margin-bottom: 20px; outline: none; }
    </style>
</head>
<body>

    <div id="auth-modal" class="modal-overlay fixed inset-0 z-[100] items-center justify-center bg-black/80 backdrop-blur-md px-4">
        <div class="modal-content glass max-w-md w-full p-8 rounded-[2.5rem] border border-white/20 shadow-2xl relative">
            <button onclick="closeModals()" class="absolute top-6 right-6 text-slate-400 hover:text-white transition">
                <i class="fas fa-times text-xl"></i>
            </button>
            <div id="login-view">
                <div class="text-center mb-8">
                    <h3 class="text-2xl font-bold text-white mb-2">Hoş Geldiniz</h3>
                    <p class="text-slate-400 text-sm">Giriş yap veya kayıt ol.</p>
                </div>
                <div class="space-y-4">
                    <input type="email" id="login-email" placeholder="E-Posta" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white">
                    <input type="password" id="login-pass" placeholder="Şifre" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white">
                    <div class="flex gap-2">
                        <button onclick="handleSignIn()" class="flex-1 bg-white/10 hover:bg-white/20 text-white font-bold py-4 rounded-xl">Giriş Yap</button>
                        <button onclick="handleSignUp()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl">Kayıt Ol</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <nav class="fixed w-full z-50 glass py-4 px-6 flex justify-between items-center">
        <div class="text-2xl font-extrabold tracking-tighter text-white">VOICE<span class="text-blue-500">2</span>POST</div>
        <div class="flex items-center space-x-4">
            <div class="relative">
                <button id="nav-login-btn" onclick="handleNavClick()" class="bg-blue-600 text-white px-5 py-2 rounded-full text-sm font-bold transition shadow-lg">Giriş Yap</button>
                <div id="user-dropdown" class="dropdown-menu absolute right-0 mt-4 w-64 rounded-2xl py-3">
                    <div class="px-6 py-4 border-b border-white/10"><p id="user-display-email" class="text-sm text-white truncate"></p></div>
                    <div class="p-2"><button onclick="logout()" class="w-full text-left px-4 py-3 text-red-400 font-semibold">Oturumu Kapat</button></div>
                </div>
            </div>
        </div>
    </nav>

    <header id="arac" class="pt-32 pb-20 px-6 text-center">
        <h1 class="text-5xl md:text-7xl font-extrabold text-white leading-tight mb-6">
            <span class="gradient-text">Profesyonel Posta</span> Dönüştür
        </h1>

        <div class="max-w-4xl mx-auto p-12 rounded-[2.5rem] glass shadow-2xl border border-white/10 mt-12">
            <div class="flex flex-col items-center">
                <div class="input-mode-container" id="mode-toggle">
                    <div class="mode-slider" id="mode-slider"></div>
                    <div class="mode-option active" id="opt-mic" onclick="setMode('mic')">
                        <i class="fas fa-microphone"></i> Ses
                    </div>
                    <div class="mode-option" id="opt-text" onclick="setMode('text')">
                        <i class="fas fa-keyboard"></i> Metin
                    </div>
                </div>
                
                <div id="voice-input-ui">
                    <div class="flex items-center gap-4">
                        <div id="record-btn" class="w-24 h-24 bg-blue-600 rounded-full flex items-center justify-center cursor-pointer shadow-xl">
                            <i id="mic-icon" class="fas fa-microphone text-4xl text-white"></i>
                        </div>
                    </div>
                    <p id="status-text" class="mt-8 font-medium text-slate-300 italic">Dokun ve anlatmaya başla...</p>
                </div>

                <div id="text-input-ui" class="hidden w-full">
                    <textarea id="manual-text" class="text-input-area" placeholder="Metni buraya yaz..."></textarea>
                    <button onclick="processManualText()" class="bg-blue-600 text-white px-8 py-3 rounded-full font-bold">Oluştur</button>
                </div>

                <div id="ai-result-container" class="hidden w-full mt-12 border-t border-white/10 pt-10 text-left">
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <div class="space-y-8">
                            <div>
                                <div class="flex justify-between mb-2">
                                    <span class="text-blue-400 font-bold">LINKEDIN</span>
                                    <button onclick="copyText('linkedin-res')" class="text-xs">Kopyala</button>
                                </div>
                                <div id="linkedin-res" class="p-6 bg-white/5 rounded-2xl border border-white/5 text-sm"></div>
                            </div>
                            <div>
                                <div class="flex justify-between mb-2">
                                    <span class="text-slate-400 font-bold">X (TWITTER)</span>
                                    <button onclick="copyText('x-res')" class="text-xs">Kopyala</button>
                                </div>
                                <div id="x-res" class="p-6 bg-white/5 rounded-2xl border border-white/5 text-sm"></div>
                            </div>
                        </div>

                        <div id="video-box">
                            <span class="text-pink-500 font-bold mb-4 block">VİDEO ÖNİZLEME</span>
                            <div class="relative glass rounded-[2.5rem] bg-black overflow-hidden" style="aspect-ratio: 9/16; max-width: 300px; margin: 0 auto;">
                                <div id="video-loader" class="absolute inset-0 flex flex-col items-center justify-center z-10 bg-slate-900/90">
                                    <i class="fas fa-circle-notch fa-spin text-4xl text-pink-500 mb-4"></i>
                                    <p class="text-xs font-bold uppercase">Hazırlanıyor...</p>
                                </div>
                                <div id="remotion-live-area" class="w-full h-full opacity-0 transition-opacity"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDaZ3eZsoAKW3ZazFPebAd-b147KaW5wOA",
          authDomain: "voice2post-9e8ca.firebaseapp.com",
          projectId: "voice2post-9e8ca",
          storageBucket: "voice2post-9e8ca.firebasestorage.app",
          messagingSenderId: "511446656614",
          appId: "1:511446656614:web:925aed5ec7d6f3fb716fa7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.handleSignIn = async () => {
            const e = document.getElementById('login-email').value;
            const p = document.getElementById('login-pass').value;
            try { await signInWithEmailAndPassword(auth, e, p); closeModals(); } catch(err) { alert(err.message); }
        };

        window.handleSignUp = async () => {
            const e = document.getElementById('login-email').value;
            const p = document.getElementById('login-pass').value;
            try { await createUserWithEmailAndPassword(auth, e, p); alert("Kayıt başarılı, giriş yapın."); } catch(err) { alert(err.message); }
        };

        window.logout = () => signOut(auth).then(() => location.reload());

        onAuthStateChanged(auth, (user) => {
            const btn = document.getElementById('nav-login-btn');
            if (user) {
                window.isLoggedIn = true; btn.innerText = "Hesabım";
                document.getElementById('user-display-email').innerText = user.email;
            } else { window.isLoggedIn = false; btn.innerText = "Giriş Yap"; }
        });
    </script>

    <script>
        let isProcessing = false, isRecording = false, recognition, finalTranscript = "";

        function setMode(mode) {
            const slider = document.getElementById('mode-slider');
            if(mode === 'mic') {
                slider.style.transform = 'translateX(0)';
                document.getElementById('voice-input-ui').classList.remove('hidden');
                document.getElementById('text-input-ui').classList.add('hidden');
            } else {
                slider.style.transform = 'translateX(100%)';
                document.getElementById('voice-input-ui').classList.add('hidden');
                document.getElementById('text-input-ui').classList.remove('hidden');
            }
        }

        async function processAIResult(text) {
            if(!text.trim() || isProcessing) return;
            if(!window.isLoggedIn) return document.getElementById('auth-modal').classList.add('active');
            
            isProcessing = true;
            document.getElementById('status-text').innerText = "AI Hazırlıyor...";
            document.getElementById('ai-result-container').classList.remove('hidden');
            document.getElementById('video-loader').classList.remove('hidden');

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text })
                });

                const raw = await response.text();
                const cleanJson = raw.replace(/```json|```/g, "").trim();
                const data = JSON.parse(cleanJson);

                document.getElementById('linkedin-res').innerText = data.linkedin;
                document.getElementById('x-res').innerText = data.twitter;

                if (data.video_script) {
                    const encoded = encodeURIComponent(JSON.stringify(data.video_script));
                    const liveArea = document.getElementById('remotion-live-area');
                    liveArea.innerHTML = `<iframe src="/api/render-preview?videoData=${encoded}" style="width:100%; height:100%; border:none;" id="v-frame"></iframe>`;
                    
                    document.getElementById('v-frame').onload = () => {
                        document.getElementById('video-loader').classList.add('hidden');
                        liveArea.classList.replace('opacity-0', 'opacity-100');
                        document.getElementById('status-text').innerText = "Bitti!";
                    };
                }
            } catch(e) { 
                document.getElementById('status-text').innerText = "Hata oluştu."; 
            } finally { isProcessing = false; }
        }

        function processManualText() {
            processAIResult(document.getElementById('manual-text').value);
        }

        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.lang = 'tr-TR';
            recognition.continuous = true;
            recognition.onresult = (e) => {
                finalTranscript = "";
                for (let i = 0; i < e.results.length; ++i) {
                    finalTranscript += e.results[i][0].transcript;
                }
                document.getElementById('status-text').innerText = finalTranscript;
            };
        }

        document.getElementById('record-btn').onclick = () => {
            if(!isRecording) {
                finalTranscript = ""; isRecording = true; recognition.start();
                document.getElementById('record-btn').classList.add('recording-pulse');
                document.getElementById('mic-icon').className = "fas fa-stop text-4xl text-white";
            } else {
                isRecording = false; recognition.stop();
                document.getElementById('record-btn').classList.remove('recording-pulse');
                document.getElementById('mic-icon').className = "fas fa-microphone text-4xl text-white";
                setTimeout(() => processAIResult(finalTranscript), 500);
            }
        };

        function closeModals() { document.getElementById('auth-modal').classList.remove('active'); }
        function handleNavClick() {
            if(window.isLoggedIn) document.getElementById('user-dropdown').classList.toggle('active');
            else document.getElementById('auth-modal').classList.add('active');
        }
        function copyText(id) {
            navigator.clipboard.writeText(document.getElementById(id).innerText);
            alert("Kopyalandı!");
        }
    </script>
</body>
</html>
