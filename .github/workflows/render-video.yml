name: Render Video

on:
  repository_dispatch:
    types: [render-video]
  workflow_dispatch:
    inputs:
      props:
        description: 'Remotion Props JSON'
        required: false
        default: '{"title": "Hazır", "sub": "VİDEO OLUŞTURULUYOR", "accentColor": "#3b82f6"}'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # Lock file hatasını önlemek için cache boş bırakıldı
          cache: '' 

      - name: Install Dependencies
        # package-lock.json olmasa bile hata vermeden kurması için
        run: npm install

      - name: Install System Dependencies
        # Ubuntu 24.04 'Noble' uyumlu kütüphaneler (libasound2t64 hatası giderildi)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libpangocairo-1.0-0 \
            libx11-xcb1 libxcomposite1 libxcursor1 libxdamage1 libxi6 \
            libxtst6 libcups2 libxss1 libxrandr2 libgbm1 libpango-1.0-0 \
            libgtk-3-0 libatk-bridge2.0-0 libxshmfence1

      - name: Install Remotion Browser
        run: npx remotion browser install

      - name: Render Video
        run: |
          # DÜZELTME: JSON verisini obje değil string olarak yakalıyoruz (toJson kullanımı)
          PROPS_RAW='${{ toJson(github.event.client_payload.props) || github.event.inputs.props }}'
          
          # Boş gelme ihtimaline karşı kontrol
          if [ "$PROPS_RAW" == "null" ] || [ -z "$PROPS_RAW" ]; then
            PROPS_RAW='{"title": "Hazır", "sub": "VİDEO", "accentColor": "#3b82f6"}';
          fi
          
          mkdir -p out
          
          # Remotion Render: 'MyVideo' ID'sini ve veriyi tırnak içinde gönderiyoruz
          npx remotion render src/index.tsx MyVideo out/video.mp4 \
            --props="$PROPS_RAW" \
            --browser-executable=$(npx remotion browser path) \
            --chromium-flags="--no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage" \
            --force \
            --loglevel=verbose

      - name: Upload Video
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: out/video.mp4
          retention-days: 1
