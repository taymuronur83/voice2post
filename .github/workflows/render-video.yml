name: Video Render

on:
  repository_dispatch:
    types: [render-video]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Kodları İndir
        uses: actions/checkout@v4

      - name: 2. Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 3. Paketleri Yükle
        run: npm install

      - name: 4. Videoyu Oluştur (Render)
        run: |
          # MyVideo.js dosyasını kullanarak render alıyoruz
          npm run render -- --props='{"text": "${{ github.event.client_payload.props.text }}"}'

      - name: 5. Videoyu Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: olusturulan-video
          path: out/video.mp4
