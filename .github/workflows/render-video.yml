name: Render Video

on:
  repository_dispatch:
    types: [render-video]
  workflow_dispatch:
    inputs:
      props:
        description: 'Remotion Props JSON'
        required: false
        default: '{"title": "Hazır", "sub": "VİDEO OLUŞTURULUYOR", "accentColor": "#3b82f6"}'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Depoya geri yükleme (push) yapabilmek için token ile checkout yapıyoruz
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: '' 

      - name: Install Dependencies
        run: npm install

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libpangocairo-1.0-0 \
            libx11-xcb1 libxcomposite1 libxcursor1 libxdamage1 libxi6 \
            libxtst6 libcups2 libxss1 libxrandr2 libgbm1 libpango-1.0-0 \
            libgtk-3-0 libatk-bridge2.0-0 libxshmfence1

      - name: Install Remotion Browser
        run: npx remotion browser install

      - name: Render Video
        run: |
          cat << 'EOF' > props.json
          ${{ toJson(github.event.client_payload.props) || github.event.inputs.props }}
          EOF
          
          if [ ! -s props.json ] || [ "$(cat props.json)" == "null" ]; then 
            echo '{"title": "Hazır", "sub": "VİDEO", "accentColor": "#3b82f6", "storyline": ["İçerik Hazırlanıyor..."]}' > props.json
          fi
          
          # Videonun sitede görünebilmesi için klasörü oluşturuyoruz
          mkdir -p public/outputs
          
          # Render işlemini doğrudan public klasörüne yapıyoruz
          npx remotion render src/index.tsx MyVideo public/outputs/final-video.mp4 \
            --props=./props.json \
            --force \
            --loglevel=verbose

      # GÜNCELLEME: Videoyu depona geri yükler (Sitenin videoyu görebilmesi için)
      - name: Commit and Push Video
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add public/outputs/final-video.mp4
          # Eğer video değişmediyse hata vermemesi için || true kullanıldı
          git commit -m "Video içeriği güncellendi: public/outputs/final-video.mp4" || echo "Değişiklik yok."
          git push origin main

      - name: Upload Video Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: public/outputs/final-video.mp4
          retention-days: 1
