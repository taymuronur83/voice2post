Name: Render Video
on:
  repository_dispatch:
    types: [render-video] # API'den gelen tetikleyiciyi yakalar
  workflow_dispatch:
    inputs:
      props:
        description: 'Remotion Props JSON'
        required: false
        default: '{}'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # Hızlı render için önbellekleme ekledik

      - name: Install Dependencies
        run: npm install

      - name: Install Remotion Browser
        run: npx remotion browser install

      - name: Render Video
        # Claude'dan gelen video_script verisini Remotion'ın anlayacağı 'props' formatına dönüştürüp render ediyoruz
        run: |
          PROPS='${{ github.event.client_payload.props || github.event.inputs.props }}'
          npx remotion render src/index.tsx MyVideo out/video.mp4 --props="$PROPS" --browser-executable=$(npx remotion browser locate)

      - name: Upload Video
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: out/video.mp4
          retention-days: 1 # Gereksiz depolamayı önler
