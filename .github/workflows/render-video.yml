name: Video Render (Voice2Post)

on:
  repository_dispatch:
    types: [render-video]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Bağımlılıkları Yükle
        run: npm install

      - name: Remotion Tarayıcısını Kur
        # Kırmızı X hatasının ana sebebi budur. Tarayıcı olmadan render alamaz.
        run: npx remotion browser ensure

      - name: Remotion Render Başlat
        # Dosya yollarının ve ID'nin (MyVideo) projenle uyumlu olduğunu kontrol et
        run: npx remotion render src/index.ts MyVideo out/video.mp4 --props='{"text": "${{ github.event.client_payload.props.text }}"}'

      - name: Videoyu Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: voice2post-video
          path: out/video.mp4
