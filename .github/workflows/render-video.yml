name: Render Video Workflow

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Video içeriği için komut'
        required: true
      composition:
        description: 'Remotion Composition ID'
        default: 'SocialMediaVideo'
      inputProps:
        description: 'Claude verileri (JSON)'
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      # 1. ADIM: VİDEOYU RENDER ET
      - name: Render Video
        id: render
        run: |
          npx remotion render ${{ github.event.inputs.composition }} out/video.mp4 --props='${{ github.event.inputs.inputProps }}'

      # 2. ADIM: VİDEOYU CLOUD'A YÜKLE (AWS S3 veya Vercel Blob)
      # Not: Burada videoyu bir yere yüklemezsen sitemiz videoyu göremez.
      - name: Upload to S3
        id: upload
        run: |
          # Örnek S3 yükleme komutu (Kendi ayarlarınla güncelle)
          # aws s3 cp out/video.mp4 s3://senin-bucket-ismin/videos/${{ github.run_id }}.mp4
          echo "url=https://senin-storage-linkin.com/${{ github.run_id }}.mp4" >> $GITHUB_OUTPUT

      # 3. ADIM: SİTEYE HABER VER (WORKFLOW BRIDGE)
      # Bu kısım eksik olduğu için videon sitende gözükmüyor!
      - name: Notify Website API
        run: |
          curl -X POST https://senin-siten.com/api/video-ready \
          -H "Content-Type: application/json" \
          -d '{
            "videoUrl": "${{ steps.upload.outputs.url }}",
            "status": "completed",
            "prompt": "${{ github.event.inputs.prompt }}"
          }'

