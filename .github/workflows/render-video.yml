name: Render Video

on:
  repository_dispatch:
    types: [render-video] # api/render-video.js ile tam eşleşme sağlandı
  workflow_dispatch:
    inputs:
      props:
        description: 'Remotion Props JSON'
        required: false
        default: '{"title": "Örnek", "sub": "VİDEO", "accentColor": "#3b82f6"}'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libdbus-1-3 libatk1.0-0 libasound2 libpangocairo-1.0-0 \
            libx11-xcb1 libxcomposite1 libxcursor1 libxdamage1 libxi6 \
            libxtst6 libcups2 libxss1 libxrandr2 libgbm1 libpango-1.0-0 \
            libgtk-3-0 libatk-bridge2.0-0 libxshmfence1

      - name: Install Remotion Browser
        run: npx remotion browser install

      - name: Render Video
        run: |
          # Payload'dan gelen veriyi güvenli bir değişkene alıyoruz
          PROPS='${{ github.event.client_payload.props || github.event.inputs.props }}'
          
          # Boş gelirse patlamaması için default
          if [ -z "$PROPS" ] || [ "$PROPS" == "null" ]; then 
            PROPS='{"title": "Hata", "sub": "VERI ALINAMADI", "accentColor": "#ff0000"}'; 
          fi
          
          mkdir -p out
          # index.tsx içindeki MyVideo ID'sini render eder
          npx remotion render src/index.tsx MyVideo out/video.mp4 \
            --props="$PROPS" \
            --browser-executable=$(npx remotion browser path) \
            --chromium-flags="--no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage" \
            --force \
            --loglevel=verbose

      - name: Upload Video
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: out/video.mp4
          retention-days: 1
