name: Render Video
on:
  push:
    branches:
      - '**'  # Hangi branch olursa olsun (main, master, dev) push yapınca başla
  workflow_dispatch: # Manuel butonun da orada durmasını sağlar

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Install Remotion Browser
        run: npx remotion browser install

      - name: Render Video
        run: npm run render

      - name: Upload Video
        uses: actions/upload-artifact@v4
        with:
          name: my-video
          path: out/video.mp4
