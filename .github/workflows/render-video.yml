name: Video Render

on:
  repository_dispatch:
    types: [render-video]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Render Video
        run: npm run render -- --props='{"text": "${{ github.event.client_payload.props.text }}"}'

      - name: Upload Video
        uses: actions/upload-artifact@v4
        with:
          name: video-output
          path: out/video.mp4
