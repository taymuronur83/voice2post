name: Render Video
on:
  repository_dispatch:
    types: [render-video]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install Dependencies
        run: npm install
        
      - name: Render Remotion Video
        run: |
          npx remotion render src/index.tsx MyVideo out/video.mp4 --props='${{ toJson(github.event.client_payload.inputProps) }}'

      - name: Upload Video
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: out/video.mp4
