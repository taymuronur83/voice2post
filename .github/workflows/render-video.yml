name: Video Render

on:
  repository_dispatch:
    types: [render-video] # Vercel'den gelecek olan anahtar kelime

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Render Video
        run: |
          # Buraya senin projenin render komutu gelecek (Örn: npx remotion render)
          echo "Video render işlemi başlatılıyor: ${{ github.event.client_payload.props.text }}"
          npm run build # Ya da senin render komutun neyse o
