name: Render Video
on:
  repository_dispatch:
    types: [render-video]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Vercel'de tanımladığın GH_TOKEN ismini buraya bağlıyoruz
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Render Video
        run: |
          mkdir -p public/outputs
          # 'MyVideo' ID'sini burada açıkça belirtiyoruz
          npx remotion render src/index.tsx MyVideo public/outputs/final-video.mp4 --force

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add public/outputs/final-video.mp4
          git commit -m "Video otomatik yüklendi" || echo "Değişiklik yok"
          git push origin main
