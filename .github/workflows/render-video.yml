name: Render Video

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Install Remotion Browser
        run: npx remotion browser install

      - name: Render Video
        run: npm run render

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-video
          path: out/video.mp4
