name: Render Video

on:
  repository_dispatch:
    types: [render-video]
  workflow_dispatch:
    inputs:
      props:
        description: 'Remotion Props JSON'
        required: false
        default: '{}'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libdbus-1-3 libatk1.0-0 libasound2 libpangocairo-1.0-0 \
            libx11-xcb1 libxcomposite1 libxcursor1 libxdamage1 libxi6 \
            libxtst6 libcups2 libxss1 libxrandr2 libgbm1 libpango-1.0-0 \
            libgtk-3-0 libatk-bridge2.0-0 libxshmfence1

      - name: Install Remotion Browser
        run: npx remotion browser install

      - name: Render Video
        # HATA ÇÖZÜMÜ: Tırnak çakışmasını önlemek için ifadeyi sadeleştirdik.
        # Props varsa onu kullanır, yoksa boş obje gönderir.
        run: |
          PROPS='${{ github.event.client_payload.props || github.event.inputs.props }}'
          if [ -z "$PROPS" ]; then PROPS='{}'; fi
          npx remotion render src/index.tsx MyVideo out/video.mp4 --props="$PROPS"

      - name: Upload Video
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: out/video.mp4
          retention-days: 1
