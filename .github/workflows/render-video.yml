name: Video Render

on:
  repository_dispatch:
    types: [render-video]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
      - run: npm run render -- --props='{"text": "${{ github.event.client_payload.props.text }}"}'
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/video.mp4
